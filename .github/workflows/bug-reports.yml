name: File in-app bug reports

# Reports sent from the app's "Report a problem" button land in the Supabase
# `reports` table. This drains that table into GitHub issues.
#
# Needs two repository secrets:
#   SUPABASE_URL                 the project URL (the same one the app is built with)
#   SUPABASE_SERVICE_ROLE_KEY    Project Settings -> API -> service_role. Never commit it.
# With the secrets unset the job exits quietly, so a fork does nothing.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: bug-reports
  cancel-in-progress: false

jobs:
  file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/file-reports.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
